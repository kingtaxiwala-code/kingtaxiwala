-min-tap-target:48px}*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth;overflow-x:hidden}body{font-family:var(--font-body);background-color:var(--primary-black);color:var(--primary-white);line-height:1.6;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}main{flex:1}h1,h3{font-family:var(--font-heading);color:var(--primary-white)}.gold-text{color:var(--primary-gold)}.section{padding:var(--space-xl) 0;position:relative}.section-container{max-width:var(--container-max-width);margin:0 auto;padding:0 var(--space-md)}.text-center{text-align:center}.section-header{margin-bottom:var(--space-lg)}.section-title{font-size:var(--fs-h2);margin-bottom:var(--space-xs);text-transform:uppercase;letter-spacing:2px}.section-subtitle{color:var(--text-muted);font-size:var(--fs-body);max-width:700px;margin:0 auto}.glass-panel{background:rgba(255,255,255,.03);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.05);border-radius:20px;box-shadow:0 8px 32px 0 rgba(0,0,0,.3)}.reviews-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px}.review-card{padding:30px;border-top:3px solid var(--primary-gold)}.mt-3{margin-top:1.5rem}.mb-4{margin-bottom:2rem}.form-group{margin-bottom:20px}.form-control{width:100%;padding:var(--space-sm);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--border-radius);color:var(--primary-white);font-family:var(--font-body);font-size:1rem;min-height:var(--min-tap-target)}.star-rating-input{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:10px}.star-rating-input input{display:none}.star-rating-input label{font-size:1.5rem;color:#444}.review-form-container .form-control{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--primary-white);padding:12px;border-radius:10px}.loading-placeholder{text-align:center;padding:50px;grid-column:1/-1}.review-card{position:relative}@ <body>
    <main id="main-content" style="padding-top: 80px;">
        <section id="reviews" class="section">
            <div class="section-container">
                <div class="section-header text-center">
                    <h1 class="section-title" data-i18n="reviewTitle">Customer <span class="gold-text">Reviews & Testimonials</span></h1>
                    <p class="section-subtitle" data-i18n="reviewSub">What our happy customers say about our trusted services</p>
                </div>
                
                <div id="reviews-container" class="reviews-grid">
                    <!-- Reviews will be loaded here dynamically -->
                    <div class="review-card glass-panel loading-placeholder">
                        <p>Loading reviews...</p>
                    </div>
                </div>

                <div class="review-form-container glass-panel" style="margin-top: 50px; max-width: 600px; margin-left: auto; margin-right: auto; padding: 30px;">
                    <h3 class="text-center mb-4" data-i18n="writeReviewTitle">Write a <span class="gold-text">Review</span></h3>
                    <form id="review-form">
                        <div class="form-group mb-3">
                            <label for="review-name" data-i18n="formName">Full Name</label>
                            <input type="text" id="review-name" class="form-control" placeholder="Your Name" required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="review-rating" data-i18n="formRating">Rating</label>
                            <div class="star-rating-input">
                                <input type="radio" name="rating" id="star5" value="5" required><label for="star5" class="fa-solid fa-star"></label>
                                <input type="radio" name="rating" id="star4" value="4"><label for="star4" class="fa-solid fa-star"></label>
                                <input type="radio" name="rating" id="star3" value="3"><label for="star3" class="fa-solid fa-star"></label>
                                <input type="radio" name="rating" id="star2" value="2"><label for="star2" class="fa-solid fa-star"></label>
                                <input type="radio" name="rating" id="star1" value="1"><label for="star1" class="fa-solid fa-star"></label>
                            </div>
                        </div>
                        <div class="form-group mb-4">
                            <label for="review-comment" data-i18n="formComment">Your Experience</label>
                            <textarea id="review-comment" class="form-control" rows="4" placeholder="Share your experience with us..." required></textarea>
                        </div>
                        <button type="submit" class="cta-button primary w-100" data-i18n="submitReview">Submit Review</button>
                    </form>
                    <div id="review-message" class="text-center mt-3" style="display: none;"></div>
                </div>
            </div>
        </section>
    </main>

    <script defer src="/js/lang.js?v=10.0"></script>
    <script defer src="/js/components.js?v=10.0"></script>
    <script defer src="/js/main.js?v=10.0"></script>
    <script defer src="/js/reviews.js?v=10.0"></script>
        <noscript></noscript>
        <noscript><link rel="stylesheet" href="/css/style.min.css?v=10.0"></noscript>
    </body>
</html>
