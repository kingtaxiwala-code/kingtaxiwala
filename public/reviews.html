<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews & Testimonials | King Taxiwala Travels</title>
    <meta name="description" content="Read what our happy customers say about our trusted cab services. Real testimonials from travelers who experienced our safe and professional car travels.">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css?v=10.0">
</head>
<body>
    <main id="main-content" style="padding-top: 80px;">
        <section id="reviews" class="section">
            <div class="section-container">
                <div class="section-header text-center">
                    <h1 class="section-title" data-i18n="reviewTitle">Customer <span class="gold-text">Reviews & Testimonials</span></h1>
                    <p class="section-subtitle" data-i18n="reviewSub">What our happy customers say about our trusted services</p>
                </div>
                
                <div id="reviews-container" class="reviews-grid">
                    <!-- Reviews will be loaded here dynamically -->
                    <div class="review-card glass-panel loading-placeholder">
                        <p>Loading reviews...</p>
                    </div>
                </div>

                <div class="review-form-container glass-panel" style="margin-top: 50px; max-width: 600px; margin-left: auto; margin-right: auto; padding: 30px;">
                    <h3 class="text-center mb-4" data-i18n="writeReviewTitle">Write a <span class="gold-text">Review</span></h3>
                    <form id="review-form">
                        <div class="form-group mb-3">
                            <label for="review-name" data-i18n="formName">Full Name</label>
                            <input type="text" id="review-name" class="form-control" placeholder="Your Name" required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="review-rating" data-i18n="formRating">Rating</label>
                            <div class="star-rating-input">
                                <input type="radio" name="rating" id="star5" value="5" required><label for="star5" class="fa-solid fa-star"></label>
                                <input type="radio" name="rating" id="star4" value="4"><label for="star4" class="fa-solid fa-star"></label>
                                <input type="radio" name="rating" id="star3" value="3"><label for="star3" class="fa-solid fa-star"></label>
                                <input type="radio" name="rating" id="star2" value="2"><label for="star2" class="fa-solid fa-star"></label>
                                <input type="radio" name="rating" id="star1" value="1"><label for="star1" class="fa-solid fa-star"></label>
                            </div>
                        </div>
                        <div class="form-group mb-4">
                            <label for="review-comment" data-i18n="formComment">Your Experience</label>
                            <textarea id="review-comment" class="form-control" rows="4" placeholder="Share your experience with us..." required></textarea>
                        </div>
                        <button type="submit" class="cta-button primary w-100" data-i18n="submitReview">Submit Review</button>
                    </form>
                    <div id="review-message" class="text-center mt-3" style="display: none;"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/lang.js?v=10.0"></script>
    <script src="/js/components.js?v=10.0"></script>
    <script src="/js/main.js?v=10.0"></script>
    <script src="/js/reviews.js?v=10.0"></script>
</body>
</html>
